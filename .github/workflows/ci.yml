name: ci

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI installation
        run: vial --help
      - name: Run offline benchmark
        run: python benchmark/run_benchmark.py

  vial-core-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run VIAL core conformance tests
        run: python -m unittest discover -s vendor/vial-core/tests -v
      - name: Run VIAL core audit suite (static + evidence benchmarks)
        run: python vendor/vial-core/audit/run_all.py --full
