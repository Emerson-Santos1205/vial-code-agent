name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov
          python -m pip install -e vendor/vial-core
      - name: Test and coverage gate
        run: python -m pytest -q --cov=vial_code_agent --cov-report=term-missing --cov-fail-under=70
      - name: Compile sources
        run: python -m compileall -q src tests benchmark
      - name: Adversarial checks
        run: python benchmark/run_adversarial.py
      - name: Docker sandbox smoke test
        run: python benchmark/run_sandbox.py --limit 1
