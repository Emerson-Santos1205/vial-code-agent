name: VIAL Core Sync & Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"  # Toda segunda-feira às 06:00 UTC
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-core-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install -e vendor/vial-core

      - name: Check & Update VIAL Core Submodule Drift
        run: |
          python -m release_orchestrator.cli sync-core --update --json

      - name: Validate Integration Tests
        run: |
          python -m pytest tests/test_vial_integration.py tests/test_vial_full_integration.py -v

      - name: Create Pull Request on Submodule Update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): auto-update VIAL Core submodule"
          title: "chore(deps): auto-update VIAL Core submodule"
          body: |
            Atualização automatizada do submódulo `vendor/vial-core`.
            Todos os testes de integração passaram com sucesso antes da criação deste PR.
          branch: "auto-update-vial-core"
          base: "development"
          delete-branch: true
